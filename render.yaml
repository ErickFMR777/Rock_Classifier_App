# Render blueprint for the FastAPI + PyTorch inference service.
# The frontend is deployed separately on Vercel (see vercel.json).
#
# After the first deploy: copy the service URL and set it as VITE_API_URL in
# Vercel, then set FRONTEND_URL here to the Vercel domain so CORS accepts it.
services:
  - type: web
    name: rock-classifier-api
    runtime: docker
    rootDir: rock-classifier-app
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Production frontend origin, e.g. https://rock-classifier-app.vercel.app
      - key: FRONTEND_URL
        sync: false
      - key: MODELS_DIR
        value: /app/models
      - key: API_RELOAD
        value: "false"
      - key: LOG_LEVEL
        value: INFO
